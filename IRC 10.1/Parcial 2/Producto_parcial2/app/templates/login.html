<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Panel Administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --bg-main: #0b2a85; --bg-main-2: #071c5c; --bg-card: #123b9e; --bg-inset: #0a2a78;
      --sky: #5ec8ff; --sky-hover: #8bd9ff; --sky-ink: #04204f; --red: #e4202d;
      --border-color: rgba(255,255,255,.18); --text-muted: #b7c6ee;
    }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: linear-gradient(160deg, var(--bg-main), var(--bg-main-2)) fixed; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .auth-card {
      width: 100%; max-width: 400px; padding: 32px; border-radius: 16px;
      background: var(--bg-card); border: 1px solid var(--border-color); border-top: 4px solid var(--red);
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .auth-icon { font-size: 2.4rem; color: var(--sky); }
    .muted { color: var(--text-muted); }
    .form-control {
      background: var(--bg-inset); border: 1px solid var(--border-color); color: #fff; padding: 10px 14px;
    }
    .form-control:focus { background: var(--bg-inset); color: #fff; border-color: var(--sky); box-shadow: 0 0 0 .2rem rgba(94,200,255,.25); }
    .form-control::placeholder { color: #9db0e6; }
    .btn-sky {
      background: var(--sky); border-color: var(--sky); color: var(--sky-ink); font-weight: 700; padding: 10px;
    }
    .btn-sky:hover { background: var(--sky-hover); border-color: var(--sky-hover); color: var(--sky-ink); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="bi bi-cpu-fill auth-icon"></i>
      <h1 class="h4 fw-bold mt-2 mb-1">Panel Administrativo</h1>
      <p class="muted small mb-0">Acceso de administración</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="small muted mb-1" for="username">Usuario</label>
        <input type="text" class="form-control" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="mb-4">
        <label class="small muted mb-1" for="password">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-sky w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión</button>
    </form>
  </div>
</body>
</html>
