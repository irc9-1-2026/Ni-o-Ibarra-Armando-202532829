<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Panel Administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --bg-main: #04164f; --bg-main-2: #020b30; --bg-card: #08256f; --bg-inset: #051a56;
      --sky: #38bdf8; --sky-hover: #7dd3fc; --sky-ink: #032046; --red: #e11d2e;
      --border-color: rgba(110, 150, 240, 0.28); --text-muted: #a9b9e6;
    }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: linear-gradient(180deg, var(--bg-main), var(--bg-main-2)) fixed; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .auth-card {
      width: 100%; max-width: 400px; padding: 28px 32px 32px; border-radius: 16px;
      background: var(--bg-card); border: 1px solid var(--border-color); border-top: 4px solid var(--red);
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    /* El logo trae un fondo azul cuadrado: se mezcla con el fondo de la tarjeta y se difumina en los bordes */
    .logo-mobil {
      display: block; width: 230px; max-width: 80%; margin: -34px auto -34px;
      mix-blend-mode: lighten;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 52%, transparent 74%);
      mask-image: radial-gradient(ellipse at center, #000 52%, transparent 74%);
    }
    .muted { color: var(--text-muted); }
    .form-control { background: var(--bg-inset); border: 1px solid var(--border-color); color: #fff; padding: 10px 14px; }
    .form-control:focus { background: var(--bg-inset); color: #fff; border-color: var(--sky); box-shadow: 0 0 0 .2rem rgba(56,189,248,.25); }
    .form-control::placeholder { color: #8fa3dd; }
    .btn-sky { background: var(--sky); border-color: var(--sky); color: var(--sky-ink); font-weight: 700; padding: 10px; }
    .btn-sky:hover { background: var(--sky-hover); border-color: var(--sky-hover); color: var(--sky-ink); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='img/mobil.png') }}" alt="Mobil" class="logo-mobil">
      <h1 class="h5 fw-bold mt-2 mb-1">Panel Administrativo</h1>
      <p class="muted small mb-0">Acceso de administración</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="small muted mb-1" for="username">Usuario</label>
        <input type="text" class="form-control" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="mb-4">
        <label class="small muted mb-1" for="password">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-sky w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión</button>
    </form>
  </div>
</body>
</html>
