<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaz Ansible</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --terminal-bg: #090d16;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            margin-bottom: 2rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            background-color: #0f172a;
            color: var(--text-main);
            border: 1px solid #334155;
            font-size: 1rem;
            margin-bottom: 1.25rem;
            outline: none;
        }

        select:focus {
            border-color: var(--accent);
        }

        .btn-run {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 700;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
        }

        .btn-run:hover {
            background-color: var(--accent-hover);
        }

        .terminal-container {
            background-color: var(--terminal-bg);
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
        }

        .terminal-header {
            background-color: #1e293b;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }

        pre {
            margin: 0;
            padding: 1.25rem;
            color: #4ade80;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 450px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚀 Control Hub de Automatización Ansible</h1>
    </div>

    <div class="card">
        <form method="POST">
            <label for="playbook">Selecciona la tarea a ejecutar en la VM (192.168.56.107):</label>
            <select name="playbook_file" id="playbook">
                <option value="ejemplo.yml" {% if playbook_actual == 'ejemplo.yml' %}selected{% endif %}>
                    ⚡ 1. Prueba de Conexión Básica (Smoke Test)
                </option>
                <option value="diagnostico.yml" {% if playbook_actual == 'diagnostico.yml' %}selected{% endif %}>
                    📊 2. Diagnóstico de Salud y Rendimiento (RAM/CPU)
                </option>
                <option value="backup.yml" {% if playbook_actual == 'backup.yml' %}selected{% endif %}>
                    📦 3. Respaldo de Seguridad Express (Archivos y Configs)
                </option>
                <option value="auditoria_forense.yml" {% if playbook_actual == 'auditoria_forense.yml' %}selected{% endif %}>
                    🕵️ 4. Auditoría Forense y Rastreos SSH (MAC, VPN y Geolocalización)
                </option>
            </select>
            <button type="submit" class="btn-run">▶ Ejecutar Playbook</button>
        </form>
    </div>

    {% if output %}
    <div class="terminal-container">
        <div class="terminal-header">
            <span>Salida de Consola — {{ playbook_actual }}</span>
            <span>Estado: Finalizado</span>
        </div>
        <pre>{{ output }}</pre>
    </div>
    {% endif %}
</div>

</body>
</html>
