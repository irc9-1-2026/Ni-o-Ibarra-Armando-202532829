---
- name: Respaldo de Seguridad Express
  hosts: servers
  become: true
  gather_facts: false
  tasks:
    - name: 1. Crear directorio para respaldos si no existe
      file:
        path: /var/backups/ansible_express
        state: directory
        mode: '0755'

    - name: 2. Limpiar todos los respaldos y archivos anteriores
      shell: "rm -rf /var/backups/ansible_express/*"

    - name: 3. Obtener fecha y hora actual
      command: date "+%Y-%m-%d_%H-%M-%S"
      register: timestamp

    - name: 4. Generar nuevo archivo comprimido con timestamp
      shell: >
        tar -czf /var/backups/ansible_express/backup_rocky_{{ timestamp.stdout }}.tar.gz
        /etc/hosts
        /etc/resolv.conf
        /var/log/dnf.log

    - name: 5. Confirmar estado del respaldo
      debug:
        msg:
          - "====== 📦 BACKUP COMPLETADO EXITOSAMENTE (ROCKY LINUX) ======"
          - "Archivo generado: /var/backups/ansible_express/backup_rocky_{{ timestamp.stdout }}.tar.gz"
          - "FECHA Y HORA REGISTRADA: {{ timestamp.stdout }}"
          - "Estado: Se limpio el directorio y se genero el nuevo respaldo con fecha en el nombre."