---
- name: Respaldo de la base de datos del portal (MongoDB) en Rocky2
  hosts: "{{ target_host | default('Rocky2') }}"
  gather_facts: no
  vars:
    backup_dir: /root/backups
  tasks:
    - name: Crear directorio de respaldos
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'

    - name: Generar respaldo con mongodump
      ansible.builtin.shell: |
        set -e
        f="{{ backup_dir }}/itsm_db_$(date +%Y%m%d_%H%M%S).archive.gz"
        docker exec mongodb_itsm mongodump --db itsm_db --archive --gzip > "$f"
        test -s "$f"
        chmod 600 "$f"
        echo "[OK] Respaldo creado: $f"
        echo "Tamaño: $(du -h "$f" | cut -f1)"
        echo "[OK] Verificación: el archivo no está vacío"
        ls -1t {{ backup_dir }}/itsm_db_*.archive.gz | tail -n +11 | xargs -r rm -f
        echo "Respaldos conservados: $(ls -1 {{ backup_dir }}/itsm_db_*.archive.gz | wc -l) (máximo 10)"
        echo "Ubicación en Rocky2: {{ backup_dir }}"
      args:
        executable: /bin/bash
      register: respaldo

    - name: Reporte del respaldo
      ansible.builtin.debug:
        msg: "{{ respaldo.stdout_lines }}"