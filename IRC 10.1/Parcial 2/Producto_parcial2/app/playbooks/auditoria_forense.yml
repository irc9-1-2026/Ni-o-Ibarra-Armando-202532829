---
- name: Auditoría de seguridad de Rocky2 y del portal web
  hosts: "{{ target_host | default('Rocky2') }}"
  gather_facts: no
  tasks:
    - name: Auditar puertos, accesos y configuración
      ansible.builtin.shell: |
        # Filtro: separa accesos humanos de los que vienen de redes Docker (panel Ansible)
        cat > /tmp/filtro_ip.py <<'EOF'
        import sys, re, ipaddress
        redes = [ipaddress.ip_network(s) for s in sys.argv[1:] if s]
        panel = 0
        for linea in sys.stdin:
            linea = linea.rstrip('\n')
            m = re.search(r'\b(\d{1,3}(?:\.\d{1,3}){3})\b', linea)
            if m and any(ipaddress.ip_address(m.group(1)) in r for r in redes):
                panel += 1
            else:
                print(linea)
        print('#panel ' + str(panel))
        EOF

        subnets=$(docker network inspect $(docker network ls -q) -f '{% raw %}{{range .IPAM.Config}}{{.Subnet}} {{end}}{% endraw %}' 2>/dev/null)

        mostrar() {
          local salida; salida=$(python3 /tmp/filtro_ip.py $subnets)
          local n; n=$(echo "$salida" | grep '^#panel' | awk '{print $2}')
          echo "$salida" | grep -v '^#panel'
          [ "${n:-0}" -gt 0 ] && echo "   (se omitieron ${n} conexiones internas del panel Ansible)"
          return 0
        }

        echo "Puertos en escucha (22, 5000, 8080, 27017):"
        ss -tuln | grep -E ':(22|5000|8080|27017)\b' | awk '{print "   • " $1 " " $5}' | sort -u

        if ss -tln | grep -E '0\.0\.0\.0:27017|\[::\]:27017|\*:27017' >/dev/null; then
          echo "[AVISO] MongoDB (27017) está publicado a toda la red y sin autenticación"
        else
          echo "[OK] MongoDB (27017) no está expuesto a la red"
        fi

        echo "Accesos SSH aceptados (IP real de origen, últimas 24 h):"
        ok=$(journalctl -u sshd --since "24 hours ago" --no-pager 2>/dev/null | grep "Accepted" \
          | sed -E 's/^([A-Za-z]+ +[0-9]+ [0-9:]+) .*Accepted ([a-z-]+) for ([^ ]+) from ([^ ]+) port.*/   • \1 | \3 desde \4 (\2)/' | tail -n 15 | mostrar)
        if [ -n "$ok" ]; then echo "$ok"; else echo "   • sin registros"; fi

        fallidos=$(journalctl -u sshd --since "24 hours ago" --no-pager 2>/dev/null | grep -c "Failed password")
        if [ "${fallidos:-0}" -gt 0 ]; then
          echo "[AVISO] Intentos SSH fallidos en las últimas 24 h: ${fallidos}"
          echo "   IPs con más intentos fallidos:"
          journalctl -u sshd --since "24 hours ago" --no-pager 2>/dev/null | grep "Failed password" \
            | grep -oE 'from [0-9a-fA-F.:]+' | awk '{print $2}' | sort | uniq -c | sort -rn | head -n 5 \
            | awk '{print "   • " $2 " (" $1 " intentos)"}'
        else
          echo "[OK] Intentos SSH fallidos en las últimas 24 h: 0"
        fi

        prl=$(sshd -T 2>/dev/null | awk '/^permitrootlogin/ {print $2}')
        if [ "$prl" = "yes" ]; then
          echo "[AVISO] PermitRootLogin: yes (el acceso directo de root por contraseña está permitido)"
        else
          echo "[OK] PermitRootLogin: ${prl:-desconocido}"
        fi

        if systemctl is-active --quiet firewalld; then
          echo "[OK] Firewall activo"
          echo "   • Servicios permitidos: $(firewall-cmd --list-services 2>/dev/null)"
          p=$(firewall-cmd --list-ports 2>/dev/null)
          echo "   • Puertos abiertos: ${p:-ninguno adicional}"
        else
          echo "[AVISO] Firewall (firewalld) inactivo"
        fi

        echo "Últimas sesiones humanas en el servidor:"
        s=$(last -n 40 -w 2>/dev/null | grep -Ev '^(reboot|wtmp|$)' | head -n 40 | mostrar | head -n 6 | sed 's/^/   • /')
        if [ -n "$s" ]; then echo "$s"; else echo "   • sin sesiones"; fi

        echo "Acciones ejecutadas desde el panel:"
        a=$(docker exec mongodb_itsm mongo itsm_db --quiet --eval 'db.panel_accesos.find().sort({_id:-1}).limit(10).forEach(function(d){print("   • " + d.fecha + " | " + d.ip + " | " + d.accion + " | " + d.estado)})' 2>/dev/null)
        if [ -n "$a" ]; then echo "$a"; else echo "   • sin registros todavía"; fi

        echo "Últimos eventos del kernel:"
        dmesg 2>/dev/null | tail -n 5 | sed 's/^/   • /' || true

        rm -f /tmp/filtro_ip.py
      args:
        executable: /bin/bash
      register: auditoria
      changed_when: false

    - name: Reporte de auditoría
      ansible.builtin.debug:
        msg: "{{ auditoria.stdout_lines }}"