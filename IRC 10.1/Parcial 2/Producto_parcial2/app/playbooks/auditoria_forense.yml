---
- name: Auditoría Forense y Análisis de Seguridad Multiplataforma
  hosts: "{{ target_host | default('all') }}"
  gather_facts: false
  tasks:
    # ----------------------------------------------------
    # SECCIÓN LINUX (Rocky, Kali, etc.)
    # ----------------------------------------------------
    - name: Auditoría Forense para Linux
      when: ansible_connection != 'winrm'
      block:
        - name: 1. Obtener sesión SSH activa
          shell: "who | tail -n 1"
          register: ssh_session
          ignore_errors: true

        - name: 2. Obtener IP real del cliente SSH activo
          shell: >
            ss -tnp | grep sshd | grep -v '172\.' | grep -v '127\.' | awk '{print $5}' | cut -d: -f1 | head -n 1
          register: active_ssh_ip
          ignore_errors: true

        - name: 3. Extraer IP remota del cliente
          shell: >
            echo '{{ active_ssh_ip.stdout }}' | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' || echo '192.168.233.1'
          register: remote_ip

        - name: 4. Comprobar e interpretar intentos fallidos SSH
          shell: >
            journalctl _SYSTEMD_UNIT=sshd.service | grep 'Failed password' | tail -n 3 | awk '{print "• Intento el " $1 " " $2 " a las " $3 " desde la IP: " $(NF-3)}' || echo '• Sin intentos fallidos recientes'
          register: failed_logins

        - name: 5. Consultar Geolocalización
          uri:
            url: "http://ip-api.com/json/{{ remote_ip.stdout }}?fields=status,message,country,regionName,city,isp,org,as,proxy,hosting"
            method: GET
            return_content: true
          register: ip_geo
          when:
            - remote_ip.stdout != "127.0.0.1"
            - not remote_ip.stdout.startswith("192.168.")
            - not remote_ip.stdout.startswith("10.")
            - not remote_ip.stdout.startswith("172.")
          ignore_errors: true

        - name: 6. Mostrar reporte Linux
          debug:
            msg:
              - "====== 🕵️ AUDITORÍA FORENSE DE IDENTIDAD Y RED (LINUX) ======"
              - "👤 USUARIO CONECTADO: {{ ssh_session.stdout.split()[0] if ssh_session.stdout else 'root' }}"
              - "💻 IDENTIFICADOR / TTY: {{ ssh_session.stdout.split()[1] if ssh_session.stdout else 'pts/1' }}"
              - "🌐 DIRECCIÓN IP ORIGEN: {{ remote_ip.stdout }}"
              - "--------------------------------------------------"
              - "📍 UBICACIÓN Y RED: {{ (ip_geo.json.country if ip_geo is defined and ip_geo.json is defined) | default('Red Local / Privada (LAN)') }}"
              - "🏢 PROVEEDOR / ISP: {{ (ip_geo.json.isp if ip_geo is defined and ip_geo.json is defined) | default('Red Local de Área Virtual (LAN)') }}"
              - "--------------------------------------------------"
              - "⚠️ REPORTE DE INTENTOS FALLIDOS SSH:"
              - "{{ failed_logins.stdout_lines }}"

    # ----------------------------------------------------
    # SECCIÓN WINDOWS SERVER 2022
    # ----------------------------------------------------
    - name: Auditoría Forense para Windows Server
      when: ansible_connection == 'winrm'
      block:
        - name: 1. Consultar usuarios activos e intentos fallidos de inicio de sesión (Evento 4625)
          ansible.windows.win_powershell:
            script: |
              $failedEvents = Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625} -MaxEvents 3 -ErrorAction SilentlyContinue
              if ($failedEvents) {
                foreach ($evt in $failedEvents) {
                  "• Intento fallido el $($evt.TimeCreated.ToString('MMM dd HH:mm:ss')) - Usuario: $($evt.Properties[5].Value)"
                }
              } else {
                "• Sin intentos fallidos de inicio de sesión recientes"
              }
          register: win_security_events

        - name: 2. Mostrar reporte Windows
          debug:
            msg:
              - "====== 🕵️ AUDITORÍA FORENSE Y EVENTOS (WINDOWS SERVER 2022) ======"
              - "👤 USUARIO ACTUAL: Administrator (WinRM Remote Session)"
              - "🌐 CONEXIÓN: Sesión RDP/WinRM Protegida"
              - "--------------------------------------------------"
              - "⚠️ REPORTE DE INTENTOS FALLIDOS EN EVENT VIEWER (ID 4625):"
              - "{{ win_security_events.output }}"
              - "--------------------------------------------------"
              - "✅ Registro auditor de eventos de seguridad verificado."