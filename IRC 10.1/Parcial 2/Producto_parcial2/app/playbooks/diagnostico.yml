---
- name: Diagnóstico de Salud del Sistema (Linux y Windows)
  hosts: "{{ target_host | default('all') }}"
  gather_facts: false
  tasks:
    # SECCIÓN LINUX
    - name: Diagnóstico Memoria y Disco en Linux
      when: ansible_connection != 'winrm'
      block:
        - shell: "free -m | awk 'NR==2{printf \"RAM en uso: %s MB de %s MB (%.2f%%)\", $3, $2, $3*100/$2 }'"
          register: memory_linux
        - shell: "df -h / | awk 'NR==2{print \"Almacenamiento libre: \" $4 \" disponible de \" $2 \" (\" $5 \" usado)\"}'"
          register: disk_linux
        - debug:
            msg:
              - "====== 🩺 REPORTE DE SALUD (LINUX) ======"
              - "• {{ memory_linux.stdout }}"
              - "• {{ disk_linux.stdout }}"

    # SECCIÓN WINDOWS SERVER
    - name: Diagnóstico Memoria y Disco en Windows Server
      when: ansible_connection == 'winrm'
      block:
        - ansible.windows.win_powershell:
            script: |
              $ram = Get-CimInstance Win32_OperatingSystem
              "RAM en uso: $([math]::Round(($ram.TotalVisibleMemorySize - $ram.FreePhysicalMemory)/1024)) MB de $([math]::Round($ram.TotalVisibleMemorySize/1024)) MB"
          register: memory_win
        - ansible.windows.win_powershell:
            script: |
              $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
              "Almacenamiento libre C: $([math]::Round($disk.FreeSpace/1GB, 2)) GB disponible de $([math]::Round($disk.Size/1GB, 2)) GB"
          register: disk_win
        - debug:
            msg:
              - "====== 🩺 REPORTE DE SALUD (WINDOWS SERVER 2022) ======"
              - "• {{ memory_win.output[0] }}"
              - "• {{ disk_win.output[0] }}"