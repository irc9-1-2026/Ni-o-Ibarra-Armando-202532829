<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Ayuda TI | Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='extra.css') }}">
  
  <style>
    /* Fondo azul marino más oscuro */
    body.auth-body {
      background-color: #041238;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: #ffffff;
    }

    /* Tarjeta con borde superior rojo y fondo azul integrado */
    .auth-card {
      background-color: #092368;
      border-radius: 12px;
      padding: 38px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid #1d4ed8;
      border-top: 4px solid #ef233c; /* Borde rojo superior */
      color: #ffffff;
    }

    /* Inputs estilizados sin placeholders */
    .form-control {
      background-color: #061848 !important;
      border: 1px solid #1d4ed8 !important;
      color: #ffffff !important;
      padding: 10px 14px;
      border-radius: 8px;
    }

    .form-control:focus {
      background-color: #08215e !important;
      border-color: #38bdf8 !important;
      color: #ffffff !important;
      box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25) !important;
    }

    /* Botón primario Cyan */
    .btn-primary {
      background-color: #38bdf8;
      border: none;
      color: #061e5c;
      font-weight: 700;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #0284c7;
      color: #ffffff;
    }

    /* Textos secundarios en blanco brillante */
    .text-white-custom {
      color: #f8fafc !important;
    }

    .logo-mobil {
      max-height: 50px;
      object-fit: contain;
    }
  </style>
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='img/mobil.png') }}" alt="Mobil" class="logo-mobil">
      <h1 class="h5 fw-bold mt-2 mb-1 text-white">Portal de Ayuda TI</h1>
      <p class="text-white-custom small mb-0">Inicia sesión para enviar y consultar tus solicitudes</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="small text-white-custom mb-1 fw-semibold" for="username">Usuario</label>
        <input type="text" class="form-control" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="mb-4">
        <label class="small text-white-custom mb-1 fw-semibold" for="password">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión</button>
    </form>

    <p class="text-center small text-white-custom mt-4 mb-0">¿No tienes cuenta? Solicítala al administrador de TI.</p>
  </div>
</body>
</html>
