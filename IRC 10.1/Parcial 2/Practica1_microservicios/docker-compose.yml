version: '3.8'

services:
  mongo-auth:
    image: mongo:4.4
    container_name: mongo-auth
    restart: always
    environment:
      MONGO_INITDB_DATABASE: authdb
    volumes:
      - mongo_auth_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo-tasks:
    image: mongo:4.4
    container_name: mongo-tasks
    restart: always
    environment:
      MONGO_INITDB_DATABASE: tasksdb
    volumes:
      - mongo_tasks_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-service:
    build: ./auth-service
    restart: always
    environment:
      MONGO_URI: mongodb://mongo-auth:27017/authdb
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo-auth:
        condition: service_healthy

  tasks-service:
    build: ./tasks-service
    restart: always
    environment:
      MONGO_URI: mongodb://mongo-tasks:27017/tasksdb
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo-tasks:
        condition: service_healthy

  dashboard-service:
    build: ./dashboard-service
    restart: always
    environment:
      TASKS_URL: http://tasks-service:5000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - tasks-service

  gateway:
    build: ./gateway
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - tasks-service
      - dashboard-service

volumes:
  mongo_auth_data:
  mongo_tasks_data: