---
- name: Desafío de depuración Ansible
  hosts: all
  become: true

  tasks:
    - name: Crear el usuario "Clase"
      ansible.builtin.user:
        name: Clase
        state: present
        shell: "/bin/bash"

    - name: Instalar el paquete apache
      ansible.builtin.yum:
        name: httpd
        state: installed

    - name: Copiar página de inicio
      ansible.builtin.copy:
        src: files/index.html
        dest: /var/www/html/index.html
        mode: "0644"

    - name: Habilitar servicio web
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: yes

    - name: Mostrar información del sistema
      ansible.builtin.debug:
        msg: "✓ Apache instalado en {{ ansible_distribution }} {{ ansible_distribution_version }}"
